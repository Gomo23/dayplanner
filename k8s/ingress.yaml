apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dayplanner-k8s-ingress
  namespace: dayplanner-k8s
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /k8s-api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /k8s
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
