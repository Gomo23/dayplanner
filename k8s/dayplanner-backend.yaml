apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dayplanner-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 334894867020.dkr.ecr.us-east-2.amazonaws.com/dayplanner-backend:4
          ports:
            - containerPort: 4000
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://dayplanner-postgres.ctsowgw8yfj6.us-east-2.rds.amazonaws.com:5432/dayplanner
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dayplanner-k8s
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
