apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dayplanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: backend
          image: 334894867020.dkr.ecr.us-east-2.amazonaws.com/dayplanner-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://dayplanner-postgres.ctsowgw8yfj6.us-east-2.rds.amazonaws.com:5432/dayplanner
            - name: SPRING_DATASOURCE_USERNAME
              value: dayplanner
            - name: SPRING_DATASOURCE_PASSWORD
              value: dayplanner123
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dayplanner
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
