apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dayplanner-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Gomo23/dayplanner.git
    targetRevision: main
    path: helm/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
