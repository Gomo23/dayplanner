apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dayplanner-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: dayplanner.rules
      rules:
        - alert: BackendPodDown
          expr: kube_deployment_status_replicas_available{deployment="backend", namespace="dayplanner"} < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Backend pod is down"
            description: "No backend pods available for more than 1 minute"

        - alert: FrontendPodDown
          expr: kube_deployment_status_replicas_available{deployment="frontend", namespace="dayplanner"} < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Frontend pod is down"
            description: "No frontend pods available for more than 1 minute"

        - alert: HighCPUUsage
          expr: rate(container_cpu_usage_seconds_total{namespace="dayplanner"}[5m]) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage in dayplanner"
            description: "Container CPU usage above 80% in dayplanner namespace"

        - alert: HighMemoryUsage
          expr: container_memory_usage_bytes{namespace="dayplanner"} / container_spec_memory_limit_bytes{namespace="dayplanner"} * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in dayplanner"
            description: "Container memory usage above 80% in dayplanner namespace"

        - alert: BackendHighErrorRate
          expr: rate(http_server_requests_seconds_count{namespace="dayplanner",status=~"5.."}[5m]) > 0.1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High error rate on backend"
            description: "Backend returning 5xx errors at more than 0.1 req/sec"
