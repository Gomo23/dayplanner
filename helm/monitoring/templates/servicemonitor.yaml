apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dayplanner-backend
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - dayplanner
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
